name: Security dependency validation

on:
  pull_request:
  push:
    branches:
      - codex/security-october-2026

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm run build
      - name: Build Netlify static export
        run: pnpm run build
        env:
          NETLIFY: "true"
      - name: Build Electron static export and main process
        run: pnpm run build:electron
      - name: Download pinned Electron runtime for verification
        run: node node_modules/electron/install.js
      - name: Verify actual pinned Electron runtime
        run: node scripts/check-electron-runtime.cjs
      - name: Verify sandboxed desktop window
        run: |
          electron_runtime_dir=$(dirname "$(node -p 'require("electron")')")
          sudo chown root:root "$electron_runtime_dir/chrome-sandbox"
          sudo chmod 4755 "$electron_runtime_dir/chrome-sandbox"
          xvfb-run -a pnpm exec electron scripts/check-electron-window.cjs
